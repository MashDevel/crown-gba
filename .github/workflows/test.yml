name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * 1'
permissions:
  contents: read
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CROWN_ROOT: ${{ github.workspace }}/lang
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: x86_64-linux
            runner: ubuntu-24.04
          - host: arm64-linux
            runner: ubuntu-24.04-arm
          - host: x86_64-macos
            runner: macos-15-intel
          - host: arm64-macos
            runner: macos-15
          - host: x86_64-windows
            runner: windows-2025
          - host: arm64-windows
            runner: windows-11-arm
    defaults:
      run:
        shell: bash
        working-directory: gba
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: gba
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: MashDevel/crown-lang
          ref: 5ffa8705a695190c836391d5c089215fdc228c95
          path: lang
          persist-credentials: false
      - name: Fetch Crown on macOS and Linux
        if: ${{ runner.os != 'Windows' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/ci
          compiler=$(sh ../lang/bootstrap/fetch-compiler)
          echo "$(dirname "$compiler")" >> "$GITHUB_PATH"
      - name: Fetch Crown on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force target/ci | Out-Null
          $compiler = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ../lang/bootstrap/fetch.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Crown download failed' }
          [IO.Path]::GetDirectoryName($compiler) >> $env:GITHUB_PATH
      - name: Build pinned Crown compiler
        id: bootstrap
        run: |
          mkdir -p target/toolchain
          extension=""
          if [ "$RUNNER_OS" = Windows ]; then extension=".exe"; fi
          crown build ../lang/components/compiler -o "target/toolchain/crown$extension"
          "target/toolchain/crown$extension" --version
          echo "$PWD/target/toolchain" >> "$GITHUB_PATH"
      - name: Check formatting
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: crown fmt src tests --check
      - name: Install Linux display and audio services
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb pipewire
      - name: Type and structural checks for every project
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: |
          status=0
          projects=(. tests tests/core tests/validation)
          if [ "$RUNNER_OS" = Linux ]; then projects+=(tests/linux); fi
          if [ "$RUNNER_OS" = Windows ]; then projects+=(tests/windows tests/windows_gui tests/windows_playback); fi
          for project in "${projects[@]}"; do
            name=${project//\//-}
            crown lint "$project" --output "target/ci/metrics-$name.json" || status=1
          done
          exit "$status"
      - name: Check duplication across the checked-out workspace
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: crown duplication .. --output target/ci/duplication.json
      - name: Run functional tests with coverage
        id: tests
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: |
          command=(crown test . --output target/ci/tests --coverage target/ci/coverage)
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- bash tests/ci/linux-desktop "${command[@]}"
          else
            "${command[@]}"
          fi
      - name: Require 95% line and branch coverage per package
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' && steps.tests.outcome != 'skipped' }}
        run: crown coverage target/ci/coverage --output target/ci/coverage.json
      - name: Upload quality reports and test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reports-${{ matrix.host }}
          path: |
            gba/target/ci/*.json
            gba/target/ci/*.log
            gba/target/ci/tests/**
          if-no-files-found: error
          retention-days: 14
